name: Windows RDP (Ngrok)

on:
  workflow_dispatch:

jobs:
  rdp-access:
    runs-on: windows-latest

    steps:
      - name: 1. Enable RDP & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 2. Set User Password
        shell: powershell
        run: |
          $pass = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

      - name: 3. Install & Start Ngrok
        shell: powershell
        run: |
          choco install ngrok --no-progress

          # EXAMPLE TOKEN — replace with your own token
          $NGROK_AUTH_TOKEN = "3IXpT9fnoRZ7tLcISD8EUe120wn_2KVwHSBTbKyQrPcCC3gxm"

          ngrok config add-authtoken $NGROK_AUTH_TOKEN

          Start-Process ngrok -ArgumentList "tcp 3389"

          Start-Sleep -Seconds 10

      - name: 4. Get Connection Info
        shell: powershell
        run: |
          try {
            $tunnels = Invoke-RestMethod "http://localhost:4040/api/tunnels"

            if (-not $tunnels.tunnels) {
              throw "No Ngrok tunnel found."
            }

            $url = $tunnels.tunnels[0].public_url
            $cleanUrl = $url.Replace("tcp://", "")

            Write-Host "================================"
            Write-Host "RDP Address: $cleanUrl"
            Write-Host "Username: runneradmin"
            Write-Host "Password: P@ssw0rd!"
            Write-Host "================================"

            echo "::notice title=RDP Address::$cleanUrl"
            echo "::notice title=Username::runneradmin"
          }
          catch {
            Write-Error "Ngrok failed: $($_.Exception.Message)"
            exit 1
          }

      - name: 5. Keep Session Alive
        shell: powershell
        run: |
          Write-Host "Session is active."

          while ($true) {
            Start-Sleep -Seconds 60
          }
